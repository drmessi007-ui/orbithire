[workspace]
members = [
    "crates/orbit-common",
    "contracts/orbit-hire",
    "contracts/orbit-treasury",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
borsh = { version = "=1.8.1", features = ["derive"] }
near-sdk = { version = "=5.30.1", default-features = false }
orbit-common = { path = "crates/orbit-common" }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
